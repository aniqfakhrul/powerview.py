<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body data-page="{% block page %}{% endblock %}">
<div class="app">

	<div class="topbar">

		<div class="menu">
			<button data-menu="view">View</button>

	<div class="rail" id="rail"></div>

{% block scripts %}{% endblock %}
