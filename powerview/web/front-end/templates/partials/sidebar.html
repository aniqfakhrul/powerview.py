{% from "components/icon.html" import icon %}
<aside class="sidebar" aria-label="Workspace sidebar">
  <a class="brand" href="{{ url_for('index') }}">
    <img src="{{ asset_url('images/mark.svg') }}" width="28" height="28" alt="">
    <span class="brand__name">PowerView<span class="brand__suffix">.py</span></span>
    <span class="brand__version">{{ version }}</span>
  </a>
  <nav id="main-navigation" class="navigation" aria-label="Main navigation">
    {% for section in sections %}
    <div class="navigation__group">
      <p class="navigation__label">{{ section }}</p>
      {% for item in pages if item.section == section %}
      <a class="navigation__link" href="{{ url_for(item.endpoint) }}"{% if item.endpoint == page.endpoint %} aria-current="page"{% endif %}>{{ icon(item.icon) }}<span class="navigation__text">{{ item.title }}</span></a>
      {% endfor %}
    </div>
    {% endfor %}
  </nav>
  <div class="sidebar__footer">
    <button id="sidebar-toggle" class="icon-button sidebar__toggle" type="button" aria-controls="main-navigation" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">{{ icon('chevron-left') }}</button>
    <label class="theme-control" title="Color theme">
      {{ icon('theme') }}
      <select id="theme-preference" aria-label="Color theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </div>
</aside>
