{% macro icon(name, class="") %}<svg class="{{ ('icon ' ~ class) | trim }}" aria-hidden="true"><use href="{{ asset_url('images/icons.svg') }}#{{ name }}"></use></svg>{% endmacro %}
{% macro state_icon(name) %}{{ icon(name, 'icon--regular') }}{{ icon(name ~ '-filled', 'icon--filled') }}{% endmacro %}
