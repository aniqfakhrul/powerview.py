<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ page.title }} · PowerView{% endblock %}</title>
  <link rel="icon" href="{{ asset_url('images/mark.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ asset_url('css/main.css') }}">
  {% block styles %}{% endblock %}
</head>
<body data-sprite="{{ asset_url('images/icons.svg') }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% block body %}{% endblock %}
  <script type="module" src="{{ asset_url('js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
