{% extends "layouts/grid.html" %}
{% from "components/icon.html" import icon %}
{% set grid_icon = "search" %}
{% block styles %}{{ super() }}<link rel="stylesheet" href="{{ asset_url('css/pages/pathfinder.css') }}">{% endblock %}
{% block grid_actions %}<button id="pathfinder-export" class="button" type="button" title="Export filtered ACE rows as JSON" disabled>{{ icon('download') }}<span>Export rows</span></button>{% endblock %}
{% block grid_query %}
<div class="pathfinder-query" data-grid-query>
  <form id="pathfinder-form" class="pathfinder-query__form">
    <label>Target <span>Optional</span><input id="pathfinder-target" class="text-input" name="identity" placeholder="All visible domain objects" autocomplete="off" spellcheck="false" maxlength="4096"></label>
    <label>Principal <span>Optional</span><input id="pathfinder-principal" class="text-input" name="security_identifier" placeholder="Name, DN, or SID" autocomplete="off" spellcheck="false" maxlength="4096"></label>
    <label class="pathfinder-query__depth">Group depth<select id="pathfinder-depth" class="text-input" name="depth"><option value="0">0 · Direct only</option><option value="1">1 level</option><option value="2" selected>2 levels</option><option value="3">3 levels</option><option value="4">4 levels</option><option value="5">5 levels</option></select></label>
    <button id="pathfinder-find" type="submit" class="button button--primary">{{ icon('search') }}Find relations</button>
    <button id="pathfinder-cancel" type="button" class="button" hidden>Cancel</button>
  </form>
</div>
{% endblock %}
