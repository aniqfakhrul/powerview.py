{% extends "layouts/grid.html" %}
{% from "components/icon.html" import icon %}
{% block grid_actions %}<button id="user-new" aria-label="New user" class="button" type="button" title="New user" disabled>{{ icon('plus') }}<span>New</span></button>{% endblock %}
{% block grid_dialogs %}
  <dialog id="user-dialog" class="dialog" aria-labelledby="user-dialog-title">
    <form id="user-form" method="dialog">
      <h2 id="user-dialog-title" class="dialog__title">New user</h2>
      <div class="dialog__fields">
        <label>Name<input id="user-name" class="text-input" type="text" autocomplete="off" spellcheck="false" required></label>
        <label>Password<input id="user-password" class="text-input" type="password" autocomplete="new-password" required></label>
        <label>Container<input id="user-container" class="text-input text-input--mono" type="text" autocomplete="off" spellcheck="false" required></label>
      </div>
      <p id="user-error" class="form-error dialog__error" role="alert" hidden></p>
      <footer class="dialog__footer">
        <button id="user-cancel" type="button" class="button">Cancel</button>
        <button type="submit" class="button button--primary">Create</button>
      </footer>
    </form>
  </dialog>
{% endblock %}
